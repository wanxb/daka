<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>北极星打卡 · 交互原型</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="share-preview.css">
  <script src="appearance.js" defer></script>
  <!-- The selected local particle engine loads on demand; production mini-program code is separate. -->
  <script src="confetti-review.js" defer></script>
  <!-- Sharing exports actual local PNGs; WeChat-only actions stay explicitly simulated. -->
  <script src="share-preview.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Review controls live outside the phone so the product keeps its card-only home. -->
  <aside class="review-panel" aria-label="原型评审导航">
    <span class="review-mark">北极星打卡</span>
    <h1>让投入<br>慢慢有形。</h1>
    <p class="review-description">时间与数量记录工具<br>第一版交互原型 · 2026.11</p>
      <div class="celebration-review" aria-label="成功特效评审">
        <!-- Keep replay tools outside the product after the user selected the dimensional effect. -->
        <!-- Motion comparisons stay in the review shell and never become saved project preferences. -->
        <label for="celebration-material">成功反馈预览</label>
        <select id="celebration-material" aria-label="成功反馈素材">
          <option value="emoji" selected>Emoji · 轻盈散花（推荐）</option>
          <option value="emoji-fountain">Emoji · 短弧喷泉</option>
          <option value="emoji-pop">Emoji · 分批跳出</option>
          <option value="paper">立体彩纸</option>
        </select>
        <p id="confetti-review-status" role="status">选择素材后，可保存记录或点下方按钮播放。</p>
        <button data-demo="celebration-first">播放首次成功特效</button>
        <button data-demo="celebration-repeat">播放再次打卡特效</button>
      </div>
    <nav class="review-nav" aria-label="选择预览页面">
      <button data-demo="home" class="active">首页卡片<span>01</span></button>
      <button data-demo="duration">记录时间<span>02</span></button>
      <button data-demo="quantity">记录数量<span>03</span></button>
      <button data-demo="both">双项记录<span>04</span></button>
      <button data-demo="detail">累计与统计<span>05</span></button>
      <button data-demo="create">新增打卡<span>06</span></button>
      <button data-demo="empty">无项目状态<span>07</span></button>
    </nav>
    <div class="review-foot">
      <div class="share-review">
        <label for="share-review-mode">分享流程评审</label>
        <select id="share-review-mode" aria-label="分享评审状态">
          <option value="normal">正常流程</option>
          <option value="generate-failure">图片生成失败</option>
          <option value="legacy">低版本微信</option>
          <option value="album-denied">相册权限拒绝</option>
        </select>
        <button data-demo="share-record">预览打卡结果</button>
        <button data-demo="share-stats">预览统计结果</button>
      </div>
      <!-- Disposable review actions stay outside the product and reuse its actual record-success path. -->

      <p>点卡片记录，点顶部图标或项目名查看统计。<br>示例数据仅用于体验，刷新可还原。</p>
      <button data-demo="reset" class="reset-button">重置示例</button>
      <a href="board.html">查看多屏设计稿</a>
    </div>
  </aside>

  <main class="device" aria-label="小程序交互预览">
    <!-- System chrome is illustrative and intentionally excluded from keyboard navigation. -->
    <div class="status-bar" aria-hidden="true"><span>9:41</span><div class="system-icons"><i class="signal"></i><i class="wifi"></i><i class="battery"></i></div></div>
    <div id="app-header" class="app-header"></div>
    <div id="screen" class="screen"></div>
    <div id="overlay-root"></div>
    <!-- An independent modal preserves the record undo deadline beneath the sharing flow. -->
    <div id="share-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>
</body>
</html>
